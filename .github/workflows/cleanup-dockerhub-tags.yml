name: Cleanup Docker Hub Tags

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated Docker Hub tags to delete"
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          jwt=$(curl -sf -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" | jq -r .token)

          IFS=',' read -ra tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do
            echo "Deleting ${DOCKERHUB_USERNAME}/dildo-docker:${tag}"
            status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT ${jwt}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/dildo-docker/tags/${tag}/")
            echo "  status: ${status}"
          done
