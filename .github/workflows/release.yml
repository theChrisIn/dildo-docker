name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release-silicon:
    name: Release Silicon Backend
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ (env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN) && format('{0}/dildo-docker', env.DOCKERHUB_USERNAME) || '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=silicon
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            IMAGE_VERSION=${{ env.RELEASE_TAG }}
          load: true
          tags: dildo-docker:release-test-silicon
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test before publishing
        run: docker run --rm dildo-docker:release-test-silicon --help

      - name: Build and push Silicon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            IMAGE_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-carbon:
    name: Release Carbon Backend
    if: github.event.deleted != true
    needs: release-silicon
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ (env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN) && format('{0}/dildo-docker', env.DOCKERHUB_USERNAME) || '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=carbon
            type=match,pattern=v(.*),group=1,prefix=carbon-v,value=${{ env.RELEASE_TAG }}

      - name: Build local image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.carbon
          build-args: |
            IMAGE_VERSION=${{ env.RELEASE_TAG }}
          load: true
          tags: dildo-docker:release-test-carbon
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test before publishing
        run: docker run --rm dildo-docker:release-test-carbon --help

      - name: Build and push Carbon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.carbon
          build-args: |
            IMAGE_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
